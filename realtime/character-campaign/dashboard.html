<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色混合测试 · 100 场</title>
<style>
:root{color-scheme:light;--ink:#163d36;--muted:#697b74;--line:#dbe4df;--bg:#f3f6f2;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}main{max-width:1450px;margin:auto;padding:36px}h1{font-size:34px;margin:3px 0 10px}p{margin:6px 0 18px;color:var(--muted)}a{color:#2a7061}button,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}header{display:flex;justify-content:space-between;align-items:center;gap:18px}.caps{letter-spacing:.12em;font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.card b{display:block;font-size:27px}.card span{font-size:13px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(370px, .9fr) minmax(530px,1.3fr);gap:20px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:22px}.watch{position:sticky;top:15px}video{width:100%;max-height:580px;border-radius:12px;background:#dce5da}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}tbody tr{cursor:pointer}tbody tr:hover{background:#eff6f0}.selected{background:#e3efe4}.tag{display:inline-block;font-size:12px;background:#edf3ed;border-radius:5px;padding:2px 6px}.bad{color:#9c5b2b}.list{max-height:800px;overflow:auto}.detail{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bar{height:6px;background:#e2eae2;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#367969}.fine{font-size:12px;color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}@media(max-width:1050px){.layout{grid-template-columns:1fr}.watch{position:static}.cards{grid-template-columns:repeat(2,1fr)}}
</style><main><header><div><div class="caps">AEMEATH · 实验性完整链路测试</div><h1>看模型怎样回应，也看她怎样行动。</h1><p>100 场对话 · 180 轮问答 · 20 项后台活动 · 长间隔模拟时间</p></div><a href="/report" target="_blank">本批最终报告 ↗</a></header>
<div class="bar"><i id="bar" style="width:0"></i></div><div class="cards" id="cards"></div><p id="current"></p>
<section class="panel" id="audit" style="margin-bottom:20px" hidden></section>
<div class="layout"><section class="panel watch"><div class="tools"><strong id="selected">选择一个已录制的场景</strong></div><video id="video" controls preload="metadata"></video><div id="chapters" class="tools"></div><p class="fine">原速录制的真实画面和 Qwen 声音。观看回放不会调用云端模型。</p><div id="detail" class="detail"></div></section>
<section class="panel"><div class="tools"><select id="emotion"><option value="">全部情绪</option><option value="high_sad">高度悲伤</option><option value="high_excited">高度兴奋</option><option value="mild_sad">略微悲伤</option><option value="happy">较为高兴</option></select><select id="kind"><option value="">全部场景</option><option value="single">一问一答</option><option value="short">短间隔五轮</option><option value="long">长间隔五轮</option></select><button id="refresh">刷新</button><a href="/api/summary" target="_blank">完整结果 JSON</a></div>
<div class="list"><table><thead><tr><th>场景 / 情绪</th><th>问答</th><th>首声中位</th><th>动作相对声音</th><th>结果</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>
<p class="fine">初始情绪来自隔离数学系统的实验初值，随后真实变化。动作由 DeepSeek 使用原格式工具自主选择；回答由 Qwen 自由生成。用户输入为本地合成语音，未测物理麦克风和扬声器。结束、用量和后台失败均保留，不将“测试执行完”视为全部通过。</p></main>
<script>
let data,selected;const $=id=>document.getElementById(id),fmt=v=>v==null?'—':(v/1000).toFixed(2)+' s',names={single:'单轮',short:'短间隔',long:'长间隔'};
function td(text){const cell=document.createElement('td');cell.textContent=text;return cell}
function choose(c){selected=c.id;history.replaceState(null,'','?case='+encodeURIComponent(c.id));$('selected').textContent=c.id+' · '+c.label+' · '+names[c.kind];if(c.video){$('video').src='/case/'+encodeURIComponent(c.id)+'/'+encodeURIComponent(c.video);$('video').hidden=false}else{$('video').hidden=true}
$('chapters').replaceChildren(...c.turns.filter(t=>Number.isFinite(t.voiceAt)&&Number.isFinite(c.recordingStartedAt)).map((t,i)=>{const b=document.createElement('button');b.textContent='第 '+(i+1)+' 轮出声';b.onclick=()=>{$('video').currentTime=Math.max(0,(t.voiceAt-c.recordingStartedAt)/1000-1);$('video').play()};return b}));
let lines=[`实际输入 ${c.submittedFixtures} / 计划 ${c.plannedTurns} 轮；其中 ${c.voicedFixtures} 轮有声。接纳 ${c.admitted} 份响应，出声 ${c.voiced} 份；历史完成 ${c.settled}；取消 ${c.cancelled}。`,`身体动作：${Object.entries(c.actions).map(([k,v])=>k+' × '+v).join('，')||'尚无已记录的起势'}`];
for(const a of c.activities)lines.push(`后台 ${a.id}：${a.states.join(' → ')||'未开始'}；预期${a.expected}；${a.matched?'符合业务验收':'未符合或待完成'}；人物动作 ${JSON.stringify(a.bodyActions)}`);
for(const t of c.turns)lines.push(`\n用户：${t.text||''}\n回答：${t.transcript||'未产生语音'}\n首声 ${fmt(t.metrics?.lastSpeechToVoiceMs)}；动作 ${t.metrics?.bodyStartLeadMs==null?'无起势':t.metrics.bodyStartLeadMs>=0?'提前 '+fmt(t.metrics.bodyStartLeadMs):'晚 '+fmt(-t.metrics.bodyStartLeadMs)}${t.revoked?'；已取消':''}`);
if(c.errors.length)lines.push('\n记录的问题：\n'+c.errors.join('\n'));lines.push(`\n已报告 ${c.usage.reportedTokens.toLocaleString()} tokens；未知 ${c.usage.unknown} 条，保留最大预留 ${c.usage.unknownMaxReservedTokens.toLocaleString()} tokens。`);$('detail').textContent=lines.join('\n');renderRows()}
function renderRows(){if(!data)return;$('rows').replaceChildren(...data.cases.filter(c=>(!$('emotion').value||c.emotion===$('emotion').value)&&(!$('kind').value||c.kind===$('kind').value)).map(c=>{const tr=document.createElement('tr');if(c.id===selected)tr.className='selected';tr.append(td(c.id+'\n'+c.label),td(c.submittedFixtures+'/'+c.plannedTurns+' 输入，'+c.voicedFixtures+' 有声'),td(fmt(c.firstVoice.median)),td(c.bodyLag.median==null?'—':(c.bodyLag.median>=0?'晚 ':'早 ')+fmt(Math.abs(c.bodyLag.median))),td(c.phase==='finished'?(c.errors.length||c.voicedFixtures<c.plannedTurns?'已测 · 有问题':'已测'):(c.phase==='not_started'?'待测':c.phase)));tr.onclick=()=>choose(c);return tr}))}
async function refresh(){try{data=await(await fetch('/api/summary',{cache:'no-store'})).json();$('bar').style.width=data.finished+'%';$('cards').replaceChildren(...[[data.finished+'/100','场景执行完'],[data.voicedFixtures+'/180','有声音回答的输入轮数'],[data.activityMatched+'/20','后台业务符合预期 · 非完整动作'],[fmt(data.firstVoice.median),'说完到首声 · 中位'],[data.usage.unknown,'用量未知，保留预留']].map(([a,b])=>{const d=document.createElement('div');d.className='card';const n=document.createElement('b'),s=document.createElement('span');n.textContent=a;s.textContent=b;d.append(n,s);return d}));$('current').textContent=data.current?'当前：'+data.current+'。结果每15秒更新。':'当前没有正在运行的场景。';renderRows();if(!selected){const wanted=new URLSearchParams(location.search).get('case');const c=data.cases.find(c=>c.id===wanted&&c.video)||data.cases.find(c=>c.video);if(c)choose(c)}}catch(e){$('current').textContent='读取结果失败：'+e.message}}
async function finalAudit(){
try{const response=await fetch('/api/final-audit',{cache:'no-store'});if(!response.ok)return;const a=await response.json(),p=$('audit');p.hidden=false;
const title=document.createElement('strong');title.textContent='本批已归档：以实际覆盖、失败记录和原速录像为准。';
const paragraphs=[
`实际发送 ${a.submittedInputs??'—'} 轮，有声 ${a.voicedInputs??'—'} 轮。完整结论见本批报告。`,
'业务任务完成不等于人物完成了完整活动动作；动作、语音和后台活动分别验收。',
'仅闲置排期按最多10倍模拟时间推进。语音、口型、动作和模型响应时间保持真实速度。'];
p.replaceChildren(title,...paragraphs.map(text=>{const el=document.createElement('p');el.textContent=text;return el}));
}catch(e){console.warn('Final audit unavailable:',e.message)}}
finalAudit();
$('refresh').onclick=refresh;$('emotion').onchange=renderRows;$('kind').onchange=renderRows;refresh();setInterval(refresh,15000);
</script></html>
