<body><header><span>AEMEATH / FACE PREPARATION</span><a href="/action-preparation/">动作准备册 ↗</a></header><main><section><p class="eyebrow">出现、保持、退回，都从现在的脸开始</p><h1>表情也要接得住。</h1><p>持续的神情作为底色；短表情结束或被打断后，退回最新底色。说话时，发音嘴形由口型层独立控制。</p><div id="stage"></div><div class="controls"><button id="replay" disabled>重播所选表情</button><button id="cancel" disabled>中途打断</button><button id="pause" disabled>暂停</button><button data-view="face">近景</button><button data-view="front">全身</button><button data-view="side">侧面</button></div><p id="status" role="status">准备模型与资料…</p><details><summary>实际播放记录</summary><pre id="report"></pre></details></section><aside><p class="eyebrow">同一模型 · 已有资源</p><h2>先选底色，再看反应。</h2><label>持续底色<select id="base"><option value="neutral">自然</option><option value="smile">温和浅笑</option><option value="focus">认真</option><option value="shy">收敛害羞</option></select></label><label><input id="speech" type="checkbox" checked>模拟语音层持有「あ」「い」</label><p class="small">这是口型所有权测试，没有播放音频，没有调用模型。底色由此处手动选择，尚未连接正式数学情绪。</p><label>查找表情<input id="search" type="search" placeholder="原生或已有原创表情"></label><div id="recipes"></div><p id="note" class="small"></p><p class="small">原生待机与精确配套衣发持续播放。其它角色或未知用途的脸仍只作资料审阅；未开放自动使用。材质脸红与原配方头部倾斜未在此页冒充已实现。</p></aside></main><script type="module" src="./viewer.mjs"></script></body></html>
