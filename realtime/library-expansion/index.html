<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爱弥斯 · 完整动作库实验</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/webgpu":"/node_modules/three/build/three.webgpu.js","three/tsl":"/node_modules/three/build/three.tsl.js","three/addons/":"/node_modules/three/examples/jsm/","@takahirox/three-mmd":"/node_modules/@takahirox/three-mmd/dist/index.js","mmd-parser":"/node_modules/mmd-parser/build/mmdparser.module.mjs"}}</script></head>
<body><header><small>实验性 · 本地资源 · 无云端调用</small><h1>生活、交流，接成连续的动作。</h1><p id="summary">正在核对目录…</p></header>
<main><section><div id="stage"><span id="loading">正在准备人物</span><div id="caption">实际动作与支撑状态</div></div>
<div class="bar"><button data-view="front">正面</button><button data-view="angle">斜侧</button><button data-view="side">左侧</button><button data-view="other-side">右侧</button><button data-view="face">脸部</button><button id="pause">暂停</button><button id="interrupt">撤销动作 · 收稳</button></div>
<div class="bar"><label>时间 <input id="seek" type="range" min="0" max="30" step=".033" value="0"></label><output id="time">0.0 秒</output></div>
<p id="status" role="status"></p><details><summary>实际执行记录</summary><pre id="events"></pre></details></section>
<aside><article><h2>统一动作库</h2><div class="bar"><select id="category"><option value="all">全部</option><option value="native">游戏原生</option><option value="activity">生活活动</option><option value="conversation">交流动作</option></select><input id="search" placeholder="搜索名称、动作 ID"></div><select id="actions" size="9"></select><p id="description"></p>
<div class="bar"><button id="play">按当前现场执行</button><button id="inspect">独立单项预览</button></div><label>获准总时长（秒；空白为原速一次）<input id="duration" type="number" min=".1" step=".1" placeholder="原速一次"></label>
<div class="bar"><label>许可变体<select id="variant"></select></label><label>许可局部变化<select id="micro"></select></label></div>
<p class="note">此页由你选择动作。独立预览会重建演示场景并执行明示前置步骤；不是模型自主行为，也不代表真实后台任务完成。</p>
<details><summary>条件、结果与来源</summary><pre id="contract"></pre></details></article>
<article><h2>连续表现</h2><label>数学情绪样本<select id="emotion"></select></label><div class="bar"><label>主态度<select id="attitude"></select></label><label>次态度<select id="secondary"></select></label><button id="set-face">应用态度</button></div><div class="bar"><button id="attention">我开口了 · 转向交流</button><button id="resume">明确恢复工作</button><button id="release">结束持续中段</button></div><div class="bar"><button id="audio">播放已有语音</button><button id="baseline">切换原有基线</button></div><p id="face-state"></p></article>
<article><h2>覆盖与证据</h2><p id="inventory"></p><button id="export">导出本地记录</button><button id="record">录制动作画面</button><a id="recording" hidden>下载本地录像</a><details><summary>未开放的原生来源</summary><pre id="excluded"></pre></details><p class="note">动作、表情和衣发使用真实 PMX。全量数值检查、实际渲染和人工连续观感分别记录；待验收项目不冒称通过。</p></article></aside></main><script type="module" src="./viewer.mjs"></script></body></html>
