<header><b>AEMEATH / 原生行为衔接实验</b><a href="/native-resources/">原始资源逐段对照</a></header><main><h1>原生动作，完整地接起来。</h1><p>保留原生主体节奏。起势、循环和收势只从同一源目录取；取消从当前姿态和速度继续。所有组合仍是制作预览，不授予自动调度许可。</p>
<div class="layout"><aside><label for="search">查找动作来源组</label><input id="search" placeholder="名称、用途、目录"><select id="group" size="18" aria-label="原生来源组"></select><p id="summary"></p></aside><section><h2 id="name">准备目录…</h2><p id="purpose"></p><div class="toolbar"><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="angle">斜侧</button><button data-view="back">背面</button><label><input id="reference" type="checkbox">显示原骨架</label></div><div id="stage"></div>
<div class="toolbar"><button id="play" disabled>暂停</button><button id="restart" disabled>从相同起点重播</button><button id="cancel" disabled>当前位置减速停住</button><button id="end" disabled>同源End接出预览</button></div>
<div class="toolbar"><label>时间<input id="timeline" type="range" min="0" max="10" step=".001" value="0" disabled></label><output id="time"></output><label>循环次数<select id="repeat"><option>1</option><option selected>2</option><option>3</option></select></label><label>初始姿态<select id="initial"><option value="current">当前实际姿态：仅几何衔接试验</option><option value="same">本组首帧：不冒充站坐转换</option><option value="stand">原生站姿：仅几何衔接试验</option></select></label></div>
<div class="toolbar"><label><input id="joint-face" type="checkbox" disabled>联动短表情</label><label>手动选择表情<select id="face-recipe" disabled></select></label><label><input id="face-speech" type="checkbox" disabled>模拟发音嘴形</label></div><p class="notice" id="face-note">联动表情需从统一执行准备入口打开；不会阻塞身体预览。</p>
