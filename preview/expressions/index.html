<main class="layout"><section id="stage" aria-label="爱弥斯实时三维表情"><div class="stage-top"><div class="eyebrow">EXPRESSION / <span id="number">01</span></div><div class="current" id="current">自然</div></div><div class="stage-bottom"><p id="description">放松的眉眼，轻微呼吸和自然眨眼。</p><div class="row"><button id="frame">半身视角</button><button id="compare">表情对照</button></div></div><div id="loading"><strong>正在加载爱弥斯</strong><p id="load-note">读取本地模型和贴图…</p></div></section>
<aside><p class="small"><a href="/">语音口型预览 →</a></p><h2>选择一刻情绪</h2><div class="presets" id="presets"></div><div class="section"><label class="range-label" for="strength">表情强度 <output id="strength-value">80%</output></label><input id="strength" type="range" min="0" max="100" step="1" value="80"><p class="small">拖动强度，观察细微表情到明显情绪的变化。</p><label class="toggle">自然眨眼<input id="blink" type="checkbox" checked></label><label class="toggle">轻微呼吸 / 头部动作<input id="idle" type="checkbox" checked></label><label class="toggle">口型演示（无音频）<input id="talk" type="checkbox"></label></div><div class="section"><h2>单独检查</h2><div class="row"><button id="blink-once">眨眼一次</button><button id="reset">恢复自然</button></div><div class="row mouth" id="mouths"><button data-mouth="52">あ</button><button data-mouth="53">い</button><button data-mouth="54">う</button><button data-mouth="55">え</button><button data-mouth="56">お</button><button data-mouth="-1">合口</button></div><label class="range-label" for="blush" style="margin-top:18px">脸红 <output id="blush-value">0%</output></label><input id="blush" type="range" min="0" max="100" value="0"><div id="status" role="status">等待渲染器就绪</div><details><summary>查看当前调试参数</summary><pre id="debug"></pre></details></div></aside></main>
